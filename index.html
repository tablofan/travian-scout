<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TS32 Alliance Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: toolbar, then the alliance → player → village → oasis tree beside a sticky map (stacked under 1000px). */
:root {
  --bg: #edf0ec; --surface: #fafbf9; --sunk: #e1e6e1; --fg: #19211d; --muted: #59685f; --line: #cdd6cf;
  --accent: #2a5f47; --focus: #2a5f47; --faint: .16; --hover: #e6ebe6;
  --c0: #1d5bcc; --c1: #b86200; --c2: #ad1a5c;
  --p0: #0f8b8d; --p1: #7b3fbf; --p2: #2f8a2f; --p3: #37474f; --p4: #a87900; --p5: #d9480f; --p6: #1f6fd1; --p7: #c2185b;
  --wood: #7b4e22; --clay: #b0502b; --iron: #566479; --crop: #9a7a0c;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --cols: minmax(0, 1fr) 7rem 4.5rem 5.5rem 4rem 4.5rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #181f1b; --sunk: #0c100e; --fg: #e2e9e4; --muted: #92a299; --line: #2a3530;
    --accent: #7cc39d; --focus: #7cc39d; --faint: .3; --hover: #202924;
    --c0: #6f9dff; --c1: #f0a33a; --c2: #f0679f;
    --p0: #4dd0d1; --p1: #b38bff; --p2: #6fcf6f; --p3: #cfd8dc; --p4: #e0b84a; --p5: #ff8a50; --p6: #6ea8ff; --p7: #f06292;
    --wood: #c9925a; --clay: #e48a64; --iron: #a3b2c7; --crop: #e2c04a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 16px; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.bar {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
}
.field { display: grid; gap: 3px; }
.field > span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.field input, .field select { height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.field input[type=search] { width: 220px; max-width: 100%; }
.spacer { flex: 1; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.check { display: flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); }

main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 540px); gap: 16px; align-items: start; }
@media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } .mapbox { order: -1; position: static !important; max-width: 560px; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }

/* the tree */
.tree { padding: 4px 0; }
.row { display: grid; grid-template-columns: var(--cols); align-items: center; gap: 0 10px; padding: 0 14px 0 calc(8px + var(--ind, 0px)); min-height: 34px; }
.row > * { min-width: 0; }
.row .n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.row .t { font-size: 13px; color: var(--muted); }
.row.p, .row.v, .row.o { border-top: 1px solid var(--line); }
.row.p:hover, .row.v:hover, .row.o:hover { background: var(--hover); }
.lvl1 { --ind: 18px; } .lvl2 { --ind: 44px; } .lvl3 { --ind: 70px; }
.tg { display: flex; align-items: center; gap: 8px; min-width: 0; border: 0; background: transparent; padding: 6px 0; cursor: pointer; text-align: left; }
.tg .car { flex: none; width: 14px; height: 14px; display: grid; place-items: center; color: var(--muted); }
.tg .car::before { content: ""; border-style: solid; border-color: transparent transparent transparent currentColor; border-width: 5px 0 5px 7px; }
.tg[aria-expanded="true"] .car::before { border-color: currentColor transparent transparent; border-width: 7px 5px 0; }
.tg.leaf { cursor: default; } .tg.leaf .car::before { content: none; }
.lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.a { min-height: 58px; }
.row.a + .row.a, .kids + .row.a { border-top: 1px solid var(--line); }
.row.a .tag { font: 700 26px/1 var(--display); color: var(--ac); letter-spacing: .02em; }
.row.a .aname { font-size: 13px; color: var(--muted); margin-left: 2px; }
.row.a .n, .row.a .t { font-size: 14px; font-weight: 500; color: var(--fg); font-family: var(--mono); }
.row.a small { display: block; font: 400 10px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.row.a.none { opacity: .5; }
.row.hd { min-height: 26px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; border-top: 1px solid var(--line); }
.row.hd .n { font-family: var(--body); font-size: 11px; }
.hdname { padding-left: 22px; }
.row.p .lbl { font-weight: 600; }
.sw { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--sw); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--sw); }
.sw.off { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.namecell { display: flex; align-items: center; gap: 6px; min-width: 0; }
.out { color: var(--muted); text-decoration: none; font-size: 12px; padding: 0 4px; }
.out:hover { color: var(--accent); }
.coords { font-family: var(--mono); font-size: 12px; color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); white-space: nowrap; }
.coords:hover { color: var(--accent); border-bottom-color: var(--accent); }
.cap { color: var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap; }
.art { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 2px; }
.ocell { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 6px 0; grid-column: 1 / -2; }
.res { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 12px; font-weight: 500; color: var(--res); border: 1px solid var(--res); }
.res.wood { --res: var(--wood); } .res.clay { --res: var(--clay); } .res.iron { --res: var(--iron); } .res.crop { --res: var(--crop); }
.tie { font-size: 12px; color: var(--muted); }
.ck { display: grid; place-items: center; }
.ck input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.ck input:disabled { cursor: default; }
.row.done > :not(.ck) { opacity: .4; }
.row.hd .hck { text-align: center; }
.empty { padding: 10px 14px 12px calc(8px + var(--ind, 0px)); color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 30%, transparent); } to { background: transparent; } }
@media (max-width: 640px) {
  :root { --cols: minmax(0, 1fr) 4.4rem 3rem 3.6rem; }
  .c-tribe, .c-vil { display: none !important; }
  .lvl1 { --ind: 10px; } .lvl2 { --ind: 24px; } .lvl3 { --ind: 38px; }
  .row.v .namecell { flex-wrap: wrap; gap: 0 6px; padding-bottom: 6px; }
  .row.v .tg { flex: 1 0 100%; padding-bottom: 2px; }
  .row.v .coords { margin-left: 22px; }
}

/* the map */
.mapbox { position: sticky; top: 12px; padding: 12px; display: grid; gap: 8px; }
.mapbox h2 { font: 600 17px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0; display: flex; justify-content: space-between; gap: 8px; }
.mapbox h2 .num { font-size: 13px; color: var(--muted); font-weight: 400; text-transform: none; }
.mapwrap { position: relative; }
canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 4px; background: var(--sunk); }
canvas.over { cursor: pointer; }
.tip {
  position: absolute; pointer-events: none; z-index: 2; padding: 6px 9px; border-radius: 4px;
  background: var(--fg); color: var(--bg); font-size: 12px; line-height: 1.35; white-space: nowrap;
}
.tip b { font-weight: 600; }
.legend { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.legend > div { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.legend .key { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); }
.legend .sq { width: 8px; height: 8px; border-radius: 1px; background: var(--sw); }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sw); }
.legend .dia { width: 7px; height: 7px; background: var(--muted); transform: rotate(45deg); margin: 0 1px; }
.legend .ring { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--muted); box-shadow: inset 0 0 0 2px var(--surface), inset 0 0 0 6px var(--muted); }
.hint, .meta { font-size: 12px; color: var(--muted); }
.meta { border-top: 1px solid var(--line); padding-top: 8px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 4px; font-size: 13px; z-index: 5; }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <label class="field"><span>Search</span><input type="search" id="q" placeholder="Player or village"></label>
    <label class="field"><span>Tribe</span><select id="tribe"><option value="">All tribes</option></select></label>
    <label class="field"><span>Sort players by</span>
      <select id="sort"><option value="pop">Population</option><option value="vil">Villages</option><option value="oz">Oases</option><option value="name">Name</option></select>
    </label>
    <span class="spacer"></span>
    <div class="btns">
      <button class="btn" id="expand" type="button">Expand all</button>
      <button class="btn" id="collapse" type="button">Collapse all</button>
      <button class="btn" id="share" type="button">Copy link</button>
      <button class="btn" id="csv" type="button">Download CSV</button>
    </div>
  </div>

  <main>
    <section class="panel tree" id="tree" aria-label="Alliances, players, villages and oases"><div class="empty">Loading…</div></section>
    <aside class="panel mapbox">
      <h2>Map <span class="num" id="cursor"></span></h2>
      <div class="mapwrap">
        <canvas id="map" aria-label="Map of every scouted village, with the expanded players' villages and oases drawn on top"></canvas>
        <div class="tip" id="tip" hidden></div>
      </div>
      <label class="check"><input type="checkbox" id="fit" checked> Zoom to expanded players</label>
      <div class="legend" id="legend"></div>
      <div class="hint">Expand a player to draw their villages. Lines join each oasis to its village. Click a village on the map to open it in the list. Tick a row once you've scouted it; ticks are saved in this browser only.</div>
      <div class="meta" id="meta"></div>
    </aside>
  </main>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString("en-US");
const fold = s => s.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const xy = (x, y) => `(${x}|${y})`;
const SLOTS = 8;  // distinct player colours; past this many drawn players the map colours by alliance

let D, S2, alliances, players, villages, oases;
const byUid = new Map();
const state = { q: "", tribe: "", sort: "pop", fit: true, openA: new Set(), openP: new Set(), openV: new Set(), shutA: new Set(), shutP: new Set() };
const slot = new Map();  // uid -> colour slot, kept while the player stays drawn
let shown = [], lastVis = null, lastView = null, hover = null, hoverKey = "";

// Scouted ticks, kept in this browser by player uid and by village/oasis coordinates so they survive a data refresh.
const MARKS = "ts32-scout-marks";
const marks = { p: new Set(), v: new Set(), o: new Set() };
function loadMarks() {
  try { const m = JSON.parse(localStorage.getItem(MARKS) || "{}"); for (const k of ["p", "v", "o"]) marks[k] = new Set(m[k] || []); } catch { /* no storage: ticks last for this visit */ }
}
function saveMarks() {
  try { localStorage.setItem(MARKS, JSON.stringify({ p: [...marks.p], v: [...marks.v], o: [...marks.o] })); } catch { /* as above */ }
}
const vkey = t => `${t.x}|${t.y}`;
// A player's tick covers their villages and oases; a village's tick covers its oases.
const doneP = p => marks.p.has(p.uid);
const doneV = v => doneP(v.p) || marks.v.has(vkey(v));
const doneO = o => doneP(o.p) || marks.o.has(vkey(o)) || (!!o.vil[0] && marks.v.has(vkey(o.vil[0])));
const partP = p => !doneP(p) && (p.vil.some(v => marks.v.has(vkey(v))) || p.oz.some(o => marks.o.has(vkey(o))));
const partV = v => !doneV(v) && v.oz.some(o => marks.o.has(vkey(o)));

fetch("data.json").then(r => r.json()).then(data => { D = data; init(); })
  .catch(() => { $("#tree").innerHTML = `<div class="empty">Could not load data.json.</div>`; });

function init() {
  S2 = (D.size - 1) / 2;
  alliances = D.alliances.map((a, k) => ({ ...a, color: `--c${k % 3}`, players: [] }));
  const at = Object.fromEntries(alliances.map(a => [a.tag, a]));
  players = D.players.map((p, i) => ({ i, uid: p.u, name: p.n, ally: at[p.a], tribe: p.t, key: fold(p.n), vil: [], oz: [], pop: 0 }));
  for (const p of players) { p.ally.players.push(p); byUid.set(p.uid, p); }
  villages = D.villages.map((v, i) => {
    const r = { i, p: players[v[0]], name: v[1], x: v[2], y: v[3], pop: v[4], cap: !!v[6], art: v[7], key: fold(v[1]), oz: [] };
    r.p.vil.push(r); r.p.pop += r.pop; return r;
  });
  oases = D.oases.map((o, i) => {
    const r = { i, p: players[o[0]], x: o[1], y: o[2], bonus: o[3], vil: o[4].map(k => villages[k]), sure: !!o[5] };
    r.p.oz.push(r); if (r.vil[0]) r.vil[0].oz.push(r); return r;
  });
  for (const p of players) {
    p.vil.sort((a, b) => (b.cap - a.cap) || (b.pop - a.pop) || a.name.localeCompare(b.name, undefined, { numeric: true }));
    p.loose = p.oz.filter(o => !o.vil.length);
  }
  for (const t of [...new Set(players.map(p => p.tribe).filter(Boolean))].sort()) $("#tribe").add(new Option(t, t));
  $("#meta").innerHTML = `Snapshot <span class="num">${esc(D.snapshot.slice(0, 16).replace("T", " "))}</span> UTC · `
    + `<a href="${D.server}" target="_blank" rel="noopener">${esc(new URL(D.server).hostname)}</a>`;
  loadMarks();
  readHash();
  bind();
  render();
}

// ── what the filters let through, and what is open ──
const SORTS = {
  pop: (a, b) => b.pop - a.pop,
  vil: (a, b) => b.vil.length - a.vil.length || b.pop - a.pop,
  oz: (a, b) => b.oz.length - a.oz.length || b.pop - a.pop,
  name: (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }),
};
// A search opens the alliances it hits, and the players whose villages it hits.
function visible() {
  const q = fold(state.q.trim()), ps = new Map(), autoA = new Set(), autoP = new Set();
  for (const a of alliances) {
    const keep = [];
    for (const p of a.players) {
      if (state.tribe && p.tribe !== state.tribe) continue;
      if (q) {
        const vilHit = p.vil.some(v => v.key.includes(q));
        if (!p.key.includes(q) && !vilHit) continue;
        autoA.add(a.tag);
        if (vilHit) autoP.add(p.uid);
      }
      keep.push(p);
    }
    ps.set(a.tag, keep.sort(SORTS[state.sort]));
  }
  return { q, ps, autoA, autoP };
}
const openA = (a, vis) => !state.shutA.has(a.tag) && (state.openA.has(a.tag) || vis.autoA.has(a.tag));
const openP = (p, vis) => !state.shutP.has(p.uid) && (state.openP.has(p.uid) || vis.autoP.has(p.uid));

function toggleA(tag) {
  const a = alliances.find(a => a.tag === tag), vis = visible();
  if (openA(a, vis)) { state.openA.delete(tag); if (vis.autoA.has(tag)) state.shutA.add(tag); }
  else { state.openA.add(tag); state.shutA.delete(tag); }
}
function toggleP(uid) {
  const p = byUid.get(uid), vis = visible();
  if (openP(p, vis)) { state.openP.delete(uid); if (vis.autoP.has(uid)) state.shutP.add(uid); }
  else { state.openP.add(uid); state.shutP.delete(uid); }
}
// Open a player picked on the map, clearing any filter that hides them.
function reveal(p) {
  state.openA.add(p.ally.tag); state.shutA.delete(p.ally.tag);
  state.openP.add(p.uid); state.shutP.delete(p.uid);
  if (state.tribe && p.tribe !== state.tribe) state.tribe = "";
  const q = fold(state.q.trim());
  if (q && !p.key.includes(q) && !p.vil.some(v => v.key.includes(q))) state.q = "";
}

// ── colours for the drawn players ──
function assignSlots(drawn) {
  const keep = new Set(drawn.map(p => p.uid));
  for (const uid of [...slot.keys()]) if (!keep.has(uid)) slot.delete(uid);
  const used = new Set(slot.values());
  for (const p of drawn) if (!slot.has(p.uid)) { let k = 0; while (used.has(k)) k++; slot.set(p.uid, k); used.add(k); }
}
const byAlliance = () => shown.length > SLOTS;
const colorVar = p => byAlliance() ? `var(${p.ally.color})` : `var(--p${slot.get(p.uid) % SLOTS})`;

// ── the tree ──
function hl(text, q) {
  const f = fold(text), i = q ? f.indexOf(q) : -1;
  if (i < 0 || f.length !== text.length) return esc(text);
  return esc(text.slice(0, i)) + `<mark>${esc(text.slice(i, i + q.length))}</mark>` + esc(text.slice(i + q.length));
}
const mapLink = (x, y) => `<a class="coords" href="${D.server}/karte.php?x=${x}&amp;y=${y}" target="_blank" rel="noopener" title="Open on the game map">${xy(x, y)}</a>`;
const bonus = b => b ? b.split(", ").map(x => `<span class="res ${x.split(" ")[0]}">${esc(x)}</span>`).join("") : `<span class="tie">bonus not read</span>`;

function render() {
  syncControls();
  const vis = lastVis = visible(), q = vis.q, h = [];
  shown = alliances.flatMap(a => openA(a, vis) ? vis.ps.get(a.tag).filter(p => openP(p, vis)) : []);
  assignSlots(shown);
  for (const a of alliances) {
    const ps = vis.ps.get(a.tag), open = openA(a, vis), sum = f => ps.reduce((s, p) => s + f(p), 0);
    h.push(`<div class="row a${ps.length ? "" : " none"}" style="--ac:var(${a.color})">
      <button class="tg" type="button" data-a="${esc(a.tag)}" aria-expanded="${open}"><span class="car"></span><span class="tag">${esc(a.tag)}</span>${a.name && a.name !== a.tag ? `<span class="aname lbl">${esc(a.name)}</span>` : ""}</button>
      <span class="t c-tribe">${ps.length}<small>players</small></span><span class="n c-vil">${fmt(sum(p => p.vil.length))}<small>villages</small></span>
      <span class="n">${fmt(sum(p => p.pop))}<small>pop</small></span><span class="n">${fmt(sum(p => p.oz.length))}<small>oases</small></span><span class="n">${ps.filter(doneP).length}<small>scouted</small></span></div>`);
    if (!open) continue;
    h.push(`<div class="kids">`);
    h.push(ps.length
      ? `<div class="row hd lvl1"><span class="hdname">Player</span><span class="c-tribe">Tribe</span><span class="n c-vil">Villages</span><span class="n">Pop</span><span class="n">Oases</span><span class="hck">Scouted</span></div>`
      : `<div class="empty lvl1">No players match.</div>`);
    for (const p of ps) {
      const po = openP(p, vis);
      h.push(`<div class="row p lvl1${doneP(p) ? " done" : ""}" data-hp="${p.uid}">
        <span class="namecell"><button class="tg" type="button" data-p="${p.uid}" aria-expanded="${po}"><span class="car"></span>${po ? `<i class="sw" style="--sw:${colorVar(p)}"></i>` : `<i class="sw off"></i>`}<span class="lbl">${hl(p.name, q)}</span></button><a class="out" href="${D.server}/profile/${p.uid}" target="_blank" rel="noopener" title="Profile in game" aria-label="${esc(p.name)} profile in game">↗</a></span>
        <span class="t c-tribe">${esc(p.tribe || "")}</span><span class="n c-vil">${p.vil.length}</span><span class="n">${fmt(p.pop)}</span><span class="n">${p.oz.length}</span>${ck("p", p.uid, doneP(p), "", partP(p), p.name)}</div>`);
      if (po) h.push(playerKids(p, q));
    }
    h.push(`</div>`);
  }
  $("#tree").innerHTML = h.join("");
  for (const el of document.querySelectorAll("#tree input[data-part]")) el.indeterminate = true;
  writeHash();
  drawMap();
}

function playerKids(p, q) {
  const h = [`<div class="kids">`];
  for (const v of p.vil) {
    const has = v.oz.length > 0, vo = has && state.openV.has(v.i), name = `<span class="car"></span><span class="lbl">${hl(v.name, q)}</span>`;
    h.push(`<div class="row v lvl2${doneV(v) ? " done" : ""}" data-hv="${v.i}">
      <span class="namecell">${has ? `<button class="tg" type="button" data-v="${v.i}" aria-expanded="${vo}">${name}</button>` : `<span class="tg leaf">${name}</span>`}${mapLink(v.x, v.y)}${v.cap ? `<span class="cap">Capital</span>` : ""}</span>
      <span class="art c-tribe" title="${esc(v.art)}">${esc(v.art)}</span><span class="c-vil"></span><span class="n">${fmt(v.pop)}</span><span class="n">${v.oz.length || ""}</span>${ck("v", vkey(v), doneV(v), doneP(p) ? "player" : "", partV(v), v.name)}</div>`);
    if (vo) for (const o of v.oz) h.push(oasisRow(o));
  }
  if (p.loose.length) h.push(`<div class="empty lvl2">Oases not placed with a village: ${p.loose.map(o => `${xy(o.x, o.y)} ${esc(o.bonus)}`).join("; ")}</div>`);
  h.push(`</div>`);
  return h.join("");
}

// An oasis sits under the village the matching gave it; ties name the other villages it could belong to.
function oasisRow(o) {
  const others = o.vil.slice(1);
  const tie = others.length
    ? `<span class="tie" title="Same bonus type and in reach of each of these villages, so the game data can't tell which one holds it.">Could also belong to ${others.map(v => `${esc(v.name)} ${xy(v.x, v.y)}`).join(", ")}</span>` : "";
  const by = doneP(o.p) ? "player" : o.vil[0] && marks.v.has(vkey(o.vil[0])) ? "village" : "";
  return `<div class="row o lvl3${doneO(o) ? " done" : ""}" data-ho="${o.i}"><span class="ocell">${mapLink(o.x, o.y)}${bonus(o.bonus)}${tie}</span>${ck("o", vkey(o), doneO(o), by, false, `oasis ${xy(o.x, o.y)}`)}</div>`;
}

// The scouted tick; a row covered by its player's or village's tick shows it ticked and locked.
function ck(kind, key, done, by, part, label) {
  return `<span class="ck"${by ? ` title="Scouted with the ${by}"` : ""}><input type="checkbox" data-m${kind}="${esc(key)}"${done ? " checked" : ""}${by ? " disabled" : ""}${part ? " data-part" : ""} aria-label="Scouted: ${esc(label)}"></span>`;
}

function syncControls() {
  $("#q").value = state.q; $("#tribe").value = state.tribe; $("#sort").value = state.sort; $("#fit").checked = state.fit;
}

// ── the map ──
const cv = $("#map"), ctx = cv.getContext("2d");
const token = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// The game map wraps at its edges, so the view may run across the seam.
const mod = n => ((n % D.size) + D.size) % D.size;
const wrapc = n => mod(n + S2) - S2;
// The shortest stretch of one wrapping axis that holds every value: it starts just past the widest empty gap.
function cover(vals) {
  const u = [...new Set(vals)].sort((a, b) => a - b);
  let gap = u[0] + D.size - u[u.length - 1], start = u[0];
  for (let i = 1; i < u.length; i++) if (u[i] - u[i - 1] > gap) { gap = u[i] - u[i - 1]; start = u[i]; }
  return { mid: start + (D.size - gap) / 2, len: D.size - gap + 1 };
}
function view() {
  const pts = state.fit ? shown.flatMap(p => [...p.vil, ...p.oz]) : [];
  if (!pts.length) return { x0: -S2, y1: S2, span: D.size };
  const cx = cover(pts.map(t => t.x)), cy = cover(pts.map(t => t.y));
  const span = Math.min(D.size, Math.max(30, cx.len, cy.len) + 10);
  return { x0: Math.round(cx.mid - span / 2), y1: Math.round(cy.mid + span / 2), span };
}
function diamond(x, y, q) { ctx.beginPath(); ctx.moveTo(x, y - q); ctx.lineTo(x + q, y); ctx.lineTo(x, y + q); ctx.lineTo(x - q, y); ctx.closePath(); ctx.fill(); }
function drawMap() {
  const W = Math.round((cv.clientWidth || 400) * (window.devicePixelRatio || 1)), dpr = window.devicePixelRatio || 1;
  if (cv.width !== W) { cv.width = W; cv.height = W; }
  const vw = lastView = view(), s = W / vw.span;
  const px = x => (mod(x - vw.x0) + .5) * s, py = y => (mod(vw.y1 - y) + .5) * s;
  Object.assign(vw, { s, px, py, dpr });
  ctx.globalAlpha = 1; ctx.fillStyle = token("--sunk"); ctx.fillRect(0, 0, W, W);
  // grid, labelled along the top and left edges
  const step = [1, 2, 5, 10, 25, 50, 100].find(k => vw.span / k <= 9) || 100;
  ctx.font = `${10 * dpr}px "IBM Plex Mono", monospace`; ctx.lineWidth = Math.max(1, dpr * .5);
  ctx.strokeStyle = token("--line"); ctx.fillStyle = token("--muted");
  for (let i = 0; i < vw.span; i++) {
    const gx = wrapc(vw.x0 + i), gy = wrapc(vw.y1 - i);
    if (gx % step === 0 && gx !== -S2) {
      ctx.globalAlpha = gx ? .6 : 1; ctx.beginPath(); ctx.moveTo(px(gx), 0); ctx.lineTo(px(gx), W); ctx.stroke();
      ctx.globalAlpha = .9; ctx.fillText(gx, px(gx) + 3 * dpr, 11 * dpr);
    }
    if (gy % step === 0 && gy !== -S2) {
      ctx.globalAlpha = gy ? .6 : 1; ctx.beginPath(); ctx.moveTo(0, py(gy)); ctx.lineTo(W, py(gy)); ctx.stroke();
      ctx.globalAlpha = .9; ctx.fillText(gy, 3 * dpr, py(gy) - 3 * dpr);
    }
  }
  // every scouted village as a square in its alliance colour, faint once players are drawn
  const r = Math.min(9 * dpr, Math.max(1.2 * dpr, s * .8)), faint = +token("--faint") || .2;
  const ac = Object.fromEntries(alliances.map(a => [a.tag, token(a.color)]));
  const anyOpen = alliances.some(a => openA(a, lastVis));
  for (const v of villages) {
    const on = openA(v.p.ally, lastVis);
    ctx.globalAlpha = shown.length ? (on ? faint * 1.6 : faint * .7) : anyOpen ? (on ? .9 : .2) : .75;
    ctx.fillStyle = ac[v.p.ally.tag]; ctx.fillRect(px(v.x) - r / 2, py(v.y) - r / 2, r, r);
  }
  // drawn players: each oasis joined to its village, then the villages on top
  const surf = token("--surface");
  for (const p of shown) {
    const col = byAlliance() ? ac[p.ally.tag] : token(`--p${slot.get(p.uid) % SLOTS}`);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(1, .8 * dpr);
    for (const o of p.oz) {
      const v = o.vil[0];
      if (v && s >= 3 && Math.abs(px(v.x) - px(o.x)) < 8 * s && Math.abs(py(v.y) - py(o.y)) < 8 * s) { ctx.globalAlpha = doneO(o) ? .2 : .5; ctx.beginPath(); ctx.moveTo(px(v.x), py(v.y)); ctx.lineTo(px(o.x), py(o.y)); ctx.stroke(); }
      ctx.globalAlpha = doneO(o) ? .3 : .85; diamond(px(o.x), py(o.y), Math.max(r * .6, 2.2 * dpr));
    }
    for (const v of p.vil) {
      ctx.globalAlpha = doneV(v) ? .3 : 1;
      const rad = Math.max(r * .7, 2.4 * dpr) * (v.cap ? 1.3 : 1);
      ctx.beginPath(); ctx.arc(px(v.x), py(v.y), rad, 0, 7); ctx.fillStyle = col; ctx.fill();
      ctx.lineWidth = Math.max(1, dpr); ctx.strokeStyle = surf; ctx.stroke();
      if (v.cap) { ctx.beginPath(); ctx.arc(px(v.x), py(v.y), rad + 2.5 * dpr, 0, 7); ctx.strokeStyle = col; ctx.lineWidth = 1.5 * dpr; ctx.stroke(); }
    }
  }
  // ring whatever the pointer is on in the list
  if (hover) {
    ctx.globalAlpha = 1; ctx.strokeStyle = token("--fg"); ctx.lineWidth = 1.5 * dpr;
    for (const t of hover) { ctx.beginPath(); ctx.arc(px(t.x), py(t.y), Math.max(r * .7, 2.4 * dpr) + 3.5 * dpr, 0, 7); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  drawLegend();
}
function drawLegend() {
  const rows = [`<div><span>All villages:</span>${alliances.map(a => `<span class="key"><i class="sq" style="--sw:var(${a.color})"></i>${esc(a.tag)}</span>`).join("")}</div>`];
  if (shown.length) {
    const who = byAlliance() ? `<span class="key"><i class="dot" style="--sw:var(--muted)"></i>${shown.length} players, by alliance colour</span>`
      : shown.map(p => `<span class="key"><i class="dot" style="--sw:${colorVar(p)}"></i>${esc(p.name)}</span>`).join("");
    rows.push(`<div><span>Drawn:</span>${who}<span class="key"><i class="ring"></i>capital</span><span class="key"><i class="dia"></i>oasis</span><span class="key"><i class="dot" style="--sw:var(--muted);opacity:.35"></i>scouted</span></div>`);
  }
  $("#legend").innerHTML = rows.join("");
}

// map pointer: name what is under it, open it in the list on click
function under(e) {
  if (!lastView) return null;
  const b = cv.getBoundingClientRect(), k = cv.width / b.width, vw = lastView;
  const mx = (e.clientX - b.left) * k, my = (e.clientY - b.top) * k;
  let hit = null, bd = Math.max(8 * vw.dpr, vw.s * .9) ** 2;
  const near = (t, kind) => { const d = (vw.px(t.x) - mx) ** 2 + (vw.py(t.y) - my) ** 2; if (d < bd) { bd = d; hit = { t, kind }; } };
  for (const p of shown) for (const o of p.oz) near(o, "o");
  for (const v of villages) near(v, "v");
  return { hit, fx: wrapc(vw.x0 + Math.floor(mx / vw.s)), fy: wrapc(vw.y1 - Math.floor(my / vw.s)), cx: mx / k, cy: my / k };
}
cv.addEventListener("mousemove", e => {
  const u = under(e), tip = $("#tip"); if (!u) return;
  $("#cursor").textContent = xy(u.fx, u.fy);
  if (!u.hit) { tip.hidden = true; cv.classList.remove("over"); return; }
  const t = u.hit.t;
  tip.innerHTML = u.hit.kind === "v"
    ? `<b>${esc(t.name)}</b> ${xy(t.x, t.y)}${t.cap ? " · capital" : ""}${doneV(t) ? " · scouted" : ""}<br>${esc(t.p.name)} · ${esc(t.p.ally.tag)} · ${fmt(t.pop)} pop`
    : `<b>Oasis</b> ${xy(t.x, t.y)} · ${esc(t.bonus)}${doneO(t) ? " · scouted" : ""}<br>${esc(t.p.name)}${t.vil[0] ? ` · ${esc(t.vil[0].name)}` : ""}`;
  tip.hidden = false; cv.classList.add("over");
  tip.style.left = `${Math.max(4, Math.min(u.cx + 12, cv.clientWidth - tip.offsetWidth - 4))}px`;
  tip.style.top = `${u.cy + 14 + tip.offsetHeight > cv.clientHeight ? u.cy - tip.offsetHeight - 10 : u.cy + 14}px`;
});
cv.addEventListener("mouseleave", () => { $("#cursor").textContent = ""; $("#tip").hidden = true; cv.classList.remove("over"); });
cv.addEventListener("click", e => {
  const u = under(e); if (!u || !u.hit) return;
  const t = u.hit.t, v = u.hit.kind === "v" ? t : t.vil[0];
  reveal(t.p);
  if (u.hit.kind === "o" && v) state.openV.add(v.i);
  render();
  const row = document.querySelector(v ? `[data-hv="${v.i}"]` : `[data-hp="${t.p.uid}"]`);
  if (!row) return;
  row.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1500);
});
window.addEventListener("resize", () => D && drawMap());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => D && drawMap());

// ── events ──
function hoverRow(e) {
  const r = e.target.closest("[data-hp],[data-hv],[data-ho]");
  const key = !r ? "" : r.dataset.hp ? `p${r.dataset.hp}` : r.dataset.hv ? `v${r.dataset.hv}` : `o${r.dataset.ho}`;
  if (key === hoverKey) return;
  hoverKey = key;
  hover = !r ? null : r.dataset.hp ? byUid.get(+r.dataset.hp).vil : r.dataset.hv ? [villages[+r.dataset.hv]] : [oases[+r.dataset.ho]];
  drawMap();
}
function unhover() { if (hoverKey) { hoverKey = ""; hover = null; drawMap(); } }
function bind() {
  $("#q").addEventListener("input", e => { state.q = e.target.value; state.shutA.clear(); state.shutP.clear(); render(); });
  $("#tribe").addEventListener("change", e => { state.tribe = e.target.value; render(); });
  $("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
  $("#fit").addEventListener("change", e => { state.fit = e.target.checked; render(); });
  const tree = $("#tree");
  tree.addEventListener("click", e => {
    const b = e.target.closest("button.tg"); if (!b) return;
    if (b.dataset.a) toggleA(b.dataset.a);
    else if (b.dataset.p) toggleP(+b.dataset.p);
    else if (b.dataset.v) { const i = +b.dataset.v; state.openV.has(i) ? state.openV.delete(i) : state.openV.add(i); }
    const focus = Object.entries(b.dataset).map(([k, v]) => `button.tg[data-${k}="${v}"]`)[0];
    render();
    if (focus) document.querySelector(focus)?.focus({ preventScroll: true });
  });
  tree.addEventListener("mouseover", hoverRow);
  tree.addEventListener("focusin", hoverRow);
  tree.addEventListener("mouseleave", unhover);
  tree.addEventListener("focusout", e => { if (!tree.contains(e.relatedTarget)) unhover(); });
  tree.addEventListener("change", e => {
    const c = e.target.closest(".ck input"); if (!c) return;
    const k = c.dataset.mp ? "p" : c.dataset.mv ? "v" : "o", raw = c.dataset[`m${k}`], key = k === "p" ? +raw : raw;
    c.checked ? marks[k].add(key) : marks[k].delete(key);
    saveMarks(); render();
    document.querySelector(`.ck input[data-m${k}="${raw}"]`)?.focus({ preventScroll: true });
  });
  window.addEventListener("storage", e => { if (e.key === MARKS) { loadMarks(); render(); } });
  $("#expand").addEventListener("click", () => {
    for (const a of alliances) {
      const ps = lastVis.ps.get(a.tag); if (!ps.length) continue;
      state.openA.add(a.tag); state.shutA.delete(a.tag);
      for (const p of ps) { state.openP.add(p.uid); state.shutP.delete(p.uid); }
    }
    render();
  });
  $("#collapse").addEventListener("click", () => {
    state.openA.clear(); state.openP.clear(); state.openV.clear(); state.shutP.clear();
    for (const a of alliances) state.shutA.add(a.tag);
    render();
  });
  $("#share").addEventListener("click", () => {
    navigator.clipboard.writeText(location.href).then(() => toast("Link copied. It opens the same players."), () => toast("Copy failed. Use the address bar."));
  });
  $("#csv").addEventListener("click", () => {
    const rows = [["alliance", "player", "tribe", "village", "x", "y", "pop", "capital", "artifact", "oases", "scouted"]];
    for (const a of alliances) for (const p of lastVis.ps.get(a.tag)) for (const v of p.vil)
      rows.push([a.tag, p.name, p.tribe || "", v.name, v.x, v.y, v.pop, v.cap ? "yes" : "", v.art, v.oz.map(o => `${xy(o.x, o.y)} ${o.bonus}`).join("; "), doneV(v) ? "yes" : ""]);
    const cell = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(cell).join(",")).join("\n")], { type: "text/csv" }));
    a.download = `ts32-scout-${D.snapshot.slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  window.addEventListener("hashchange", () => { readHash(); render(); });
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2200); }

// ── the link keeps the filters and the open alliances and players ──
function writeHash() {
  const h = new URLSearchParams();
  if (state.q) h.set("q", state.q);
  if (state.tribe) h.set("t", state.tribe);
  if (state.sort !== "pop") h.set("s", state.sort);
  if (state.openA.size) h.set("a", [...state.openA].join("."));
  if (state.openP.size) h.set("p", [...state.openP].join("."));
  if (!state.fit) h.set("fit", "0");
  const str = h.toString();
  history.replaceState(null, "", str ? `#${str}` : location.pathname + location.search);
}
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  state.q = h.get("q") || ""; state.tribe = h.get("t") || "";
  state.sort = SORTS[h.get("s")] ? h.get("s") : "pop";
  state.openA = new Set((h.get("a") || "").split(".").filter(t => alliances.some(a => a.tag === t)));
  state.openP = new Set((h.get("p") || "").split(".").map(Number).filter(u => byUid.has(u)));
  state.openV = new Set(); state.shutA = new Set(); state.shutP = new Set();
  state.fit = h.get("fit") !== "0";
}
</script>
</body>
</html>
